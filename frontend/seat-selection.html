<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Bus Seat Selection - Ultra Premium</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism Styling */
        .glass-dark {
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Entrance Animations */
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down { animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Kerusi & Perspective Styling */
        .seat-marker {
            position: absolute;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .seat-marker.appear {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .seat-marker.appear:hover:not(.is-reserved) {
            transform: translate(-50%, -55%) scale(1.15);
            z-index: 40;
        }
        
        .seat-marker.appear.is-reserved:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Burst & Pulse Effects */
        .burst-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid #f59e0b;
            pointer-events: none;
            animation: burstAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes burstAnim {
            0% { width: 100%; height: 100%; opacity: 1; border-width: 4px; }
            100% { width: 250%; height: 250%; opacity: 0; border-width: 0; }
        }

        .pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(252, 211, 77, 0.6); 
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            opacity: 0;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        @keyframes move-arrow {
            0%, 100% { transform: translateX(0); opacity: 0.5;}
            50% { transform: translateX(8px); opacity: 1;}
        }
        .animate-arrow {
            display: inline-block;
            animation: move-arrow 1.2s infinite ease-in-out;
        }

        @keyframes shake-seat {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-55%, -50%) rotate(-8deg); }
            50% { transform: translate(-45%, -50%) rotate(8deg); }
            75% { transform: translate(-55%, -50%) rotate(-8deg); }
        }
        .shake-seat {
            animation: shake-seat 0.4s ease-in-out;
        }

        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; 
            width: 200%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(35deg) translateX(-100%);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { transform: rotate(35deg) translateX(-150%); }
            100% { transform: rotate(35deg) translateX(150%); }
        }

        .ambient-light {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(245,158,11,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body class="relative h-screen w-full flex flex-col text-white">

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none">
        <div class="bg-red-600/90 backdrop-blur-xl text-white px-6 py-3 rounded-full shadow-[0_10px_30px_rgba(220,38,38,0.5)] font-medium text-sm flex items-center gap-2 border border-red-400">
            <i class="ph-bold ph-warning-circle text-lg"></i>
            <span id="toast-message">Kerusi ini telah ditempah!</span>
        </div>
    </div>

    <!-- 1. Background Interior Layer -->
    <div class="absolute inset-0 z-0">
        <!-- Gunakan imej interior bas tempatan (image_cca655.png) atau fallback URL interior bas -->
        <img src="assets/images/bus-interior.png" alt="VIP Bus Interior" class="w-full h-full object-cover object-center" onerror="this.src='https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=1000&auto=format&fit=crop'">
        <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-black/20 to-black/90"></div>
        <div class="ambient-light"></div>
    </div>

    <!-- 2. Interactive AR Seat Markers Overlay -->
    <div class="absolute inset-0 z-10 pointer-events-none" id="seat-container">
        
        <!-- ROW 3 (Belakang) -->
        <!-- 3A (Kiri Window) -->
        <button class="seat-marker is-reserved pointer-events-auto" style="top: 47%; left: 28%;" onclick="selectSeat(this, '3A', 'Double Seat', 95, true)">
            <div class="relative w-7 h-7 rounded-full bg-red-500/20 border border-red-500/50 flex items-center justify-center backdrop-blur-sm" id="pin-3A">
                <span class="text-[9px] font-bold text-red-300">3A</span>
                <i class="ph-fill ph-lock-key absolute -top-1 -right-1 text-red-400 text-[9px] bg-black/80 rounded-full p-[2px] shadow-lg"></i>
            </div>
        </button>

        <!-- 3B (Kiri Laluan) -->
        <button class="seat-marker pointer-events-auto group" style="top: 45%; left: 38%;" onclick="selectSeat(this, '3B', 'Double Seat', 95)">
            <div class="relative w-7 h-7 rounded-full bg-white/10 border border-white/30 flex items-center justify-center backdrop-blur-md group-hover:bg-amber-400/90 transition-colors shadow-lg" id="pin-3B">
                <span class="text-[9px] font-bold">3B</span>
            </div>
        </button>

        <!-- 3C (Kanan Laluan) -->
        <button class="seat-marker pointer-events-auto group" style="top: 50%; left: 63%;" onclick="selectSeat(this, '3C', 'VIP Single', 125)">
            <div class="relative w-7 h-7 rounded-full bg-white/10 border border-white/30 flex items-center justify-center backdrop-blur-md group-hover:bg-amber-400/90 transition-colors shadow-lg" id="pin-3C">
                <span class="text-[9px] font-bold">3C</span>
            </div>
        </button>


        <!-- ROW 2 (Tengah) -->
        <!-- 2A (Kiri Window) -->
        <button class="seat-marker pointer-events-auto group" style="top: 55%; left: 22%;" onclick="selectSeat(this, '2A', 'Double Seat', 95)">
            <div class="relative w-9 h-9 rounded-full bg-white/10 border border-white/30 flex items-center justify-center backdrop-blur-md group-hover:bg-amber-400/90 transition-colors shadow-lg" id="pin-2A">
                <span class="text-[10px] font-bold">2A</span>
            </div>
        </button>
        
        <!-- 2B (Kiri Laluan) -->
        <button class="seat-marker is-reserved pointer-events-auto" style="top: 54%; left: 35%;" onclick="selectSeat(this, '2B', 'Double Seat', 95, true)">
            <div class="relative w-9 h-9 rounded-full bg-red-500/20 border border-red-500/50 flex items-center justify-center backdrop-blur-sm" id="pin-2B">
                <span class="text-[10px] font-bold text-red-300">2B</span>
                <i class="ph-fill ph-lock-key absolute -top-1 -right-1 text-red-400 text-xs bg-black/80 rounded-full p-[2px] shadow-lg"></i>
            </div>
        </button>

        <!-- 2C (Kanan Laluan) -->
        <button class="seat-marker pointer-events-auto group" style="top: 59%; left: 65%;" onclick="selectSeat(this, '2C', 'VIP Single', 125)">
            <div class="relative w-9 h-9 rounded-full bg-white/10 border border-white/30 flex items-center justify-center backdrop-blur-md group-hover:bg-amber-400/90 transition-colors shadow-lg" id="pin-2C">
                <span class="text-[10px] font-bold">2C</span>
            </div>
        </button>


        <!-- ROW 1 (Depan / Target Utama) -->
        <!-- 1A (Depan Kiri Window) -->
        <button class="seat-marker pointer-events-auto group" style="top: 76%; left: 16%;" onclick="selectSeat(this, '1A', 'Double Seat', 95)">
            <div class="relative w-11 h-11 rounded-full bg-white/10 border border-white/30 flex items-center justify-center backdrop-blur-md group-hover:bg-amber-400/90 transition-colors shadow-lg" id="pin-1A">
                <span class="text-xs font-bold">1A</span>
            </div>
        </button>

        <!-- 1B (Depan Kiri Laluan) -->
        <button class="seat-marker pointer-events-auto group" style="top: 67%; left: 30%;" onclick="selectSeat(this, '1B', 'Double Seat', 95)">
            <div class="relative w-11 h-11 rounded-full bg-white/10 border border-white/30 flex items-center justify-center backdrop-blur-md group-hover:bg-amber-400/90 transition-colors shadow-lg" id="pin-1B">
                <span class="text-xs font-bold">1B</span>
            </div>
        </button>
        
        <!-- 1C (Depan Kanan - Default Selected) -->
        <button class="seat-marker pointer-events-auto group z-20" style="top: 70%; left: 68%;" onclick="selectSeat(this, '1C', 'VIP Single', 125)">
            <div class="relative w-11 h-11 rounded-full bg-amber-500 border-2 border-white flex items-center justify-center shadow-[0_0_30px_rgba(245,158,11,0.6)] transition-colors" id="pin-1C">
                <div class="pulse-ring"></div>
                <span class="text-xs font-bold text-gray-900">1C</span>
            </div>
            <div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-black/90 backdrop-blur-md px-3 py-1 rounded-lg border border-white/20 whitespace-nowrap opacity-100 transition-opacity shadow-xl" id="tooltip-1C">
                <span class="text-amber-400 font-bold text-xs">Selected</span>
            </div>
        </button>

    </div>

    <!-- 3. UI Overlay Layer -->
    <div class="relative z-20 flex flex-col justify-between h-full pointer-events-none p-4 md:p-8">
        
        <!-- TOP CARD SECTION -->
        <div class="w-full max-w-2xl mx-auto space-y-4 pointer-events-auto animate-slide-down">
            
            <div class="flex items-center justify-between">
                <button class="w-10 h-10 rounded-full glass-dark flex items-center justify-center hover:bg-white/20 hover:scale-105 transition-all">
                    <i class="ph ph-arrow-left text-xl"></i>
                </button>
                <h1 class="text-lg font-semibold tracking-wide uppercase text-gray-200">Select Seat</h1>
                <button class="w-10 h-10 rounded-full glass-dark flex items-center justify-center hover:bg-white/20 hover:scale-105 transition-all">
                    <i class="ph ph-dots-three-outline-vertical text-xl"></i>
                </button>
            </div>

            <div class="glass-dark rounded-3xl p-5 relative overflow-hidden group">
                <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-amber-400 to-amber-600"></div>
                
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-amber-400 font-semibold uppercase tracking-widest mb-1 opacity-80">Super VIP Express</p>
                        <h2 class="text-xl md:text-2xl font-bold flex items-center gap-3">
                            Kuala Lumpur 
                            <i class="ph-bold ph-arrow-right text-amber-500 text-xl animate-arrow"></i> 
                            Johor Bahru
                        </h2>
                    </div>
                    <div class="text-right hidden sm:block transform group-hover:rotate-12 transition-transform duration-500">
                        <div class="bg-white/10 border border-white/10 rounded-xl px-4 py-2 shadow-lg">
                            <i class="ph-fill ph-armchair text-amber-400 text-xl"></i>
                        </div>
                    </div>
                </div>
                
                <hr class="border-white/10 my-4">
                
                <div class="flex items-center justify-between text-sm md:text-base text-gray-300">
                    <div class="flex items-center gap-2">
                        <div class="bg-white/5 p-1.5 rounded-lg"><i class="ph ph-calendar-blank text-amber-500"></i></div>
                        <span class="font-medium">26 Oct 2026</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="bg-white/5 p-1.5 rounded-lg"><i class="ph ph-clock text-amber-500"></i></div>
                        <span class="font-medium">10:00 PM</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="bg-white/5 p-1.5 rounded-lg"><i class="ph ph-user text-amber-500"></i></div>
                        <span class="font-medium text-white">1 Pax</span>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-center mt-2">
                <div class="bg-black/50 backdrop-blur-md rounded-full px-5 py-2 border border-white/10 text-xs font-medium text-gray-300 flex items-center gap-2 shadow-lg">
                    <i class="ph-fill ph-info text-amber-400 animate-pulse"></i> Pilih tempat duduk kosong di dalam bas
                </div>
            </div>
        </div>

        <!-- BOTTOM CONFIRMATION SECTION -->
        <div class="w-full max-w-2xl mx-auto mt-auto pointer-events-auto animate-slide-up">
            <div class="glass-dark rounded-t-3xl p-6 md:p-8 border-b-0 border-x-0 relative overflow-hidden">
                <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-32 h-32 bg-amber-500/20 blur-3xl rounded-full pointer-events-none"></div>

                <div class="flex items-end justify-between mb-6 relative z-10">
                    <div>
                        <p class="text-sm text-gray-400 mb-1 font-medium">Selected Seat</p>
                        <div class="flex items-center gap-3">
                            <h3 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-amber-500 drop-shadow-md transition-all" id="display-seat">1C</h3>
                            <span class="bg-white/10 px-3 py-1 rounded-lg text-sm border border-white/10 font-medium" id="display-type">VIP Single</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-400 mb-1 font-medium">Total Price</p>
                        <h3 class="text-2xl font-bold text-white tracking-wide">RM <span id="display-price">125</span></h3>
                    </div>
                </div>

                <div class="flex gap-4 relative z-10">
                    <button class="w-14 h-14 rounded-2xl border border-white/20 flex items-center justify-center bg-white/5 hover:bg-white/10 hover:scale-105 transition-all shadow-lg">
                        <i class="ph ph-user text-2xl text-gray-200"></i>
                    </button>
                    <button onclick="window.location.href='tracking.html'" class="btn-shimmer flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-extrabold text-lg rounded-2xl shadow-[0_0_20px_rgba(245,158,11,0.4)] hover:shadow-[0_0_30px_rgba(245,158,11,0.6)] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2 cursor-pointer">
                        Confirm Seat <i class="ph-bold ph-check-circle text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSelected = '1C';
        let toastTimeout;

        // Entrance Animation
        window.addEventListener('DOMContentLoaded', () => {
            const seats = document.querySelectorAll('.seat-marker');
            const seatsArray = Array.from(seats).reverse(); 
            
            seatsArray.forEach((seat, index) => {
                setTimeout(() => {
                    seat.classList.add('appear');
                }, 100 + (index * 80));
            });
        });

        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast-container');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.innerText = message;
            
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2500);
        }

        // Logic Pemilihan Kerusi
        function selectSeat(buttonElement, seatId, type, price, isReserved = false) {
            if (isReserved) {
                const pin = document.getElementById('pin-' + seatId);
                pin.parentElement.classList.add('shake-seat');
                showToast(`Maaf, kerusi ${seatId} telah ditempah!`);
                setTimeout(() => { pin.parentElement.classList.remove('shake-seat'); }, 400);
                return;
            }

            if (currentSelected === seatId) return;

            // 1. Reset Kerusi Sebelum
            const prevPin = document.getElementById('pin-' + currentSelected);
            const prevTooltip = document.getElementById('tooltip-' + currentSelected);
            
            if (prevPin) {
                prevPin.className = 'relative rounded-full border flex items-center justify-center backdrop-blur-md transition-all duration-300 ' + getPinBaseSize(currentSelected) + ' bg-white/10 border-white/30 group-hover:bg-amber-400/90 text-white shadow-lg';
                prevPin.innerHTML = `<span class="${getTextSize(currentSelected)} font-bold">${currentSelected}</span>`;
            }
            if (prevTooltip) prevTooltip.remove();

            // 2. Animasikan Kerusi Baru
            const newPin = document.getElementById('pin-' + seatId);
            if (newPin) {
                const burst = document.createElement('div');
                burst.className = 'burst-ring';
                newPin.appendChild(burst);
                setTimeout(() => burst.remove(), 600);

                newPin.className = 'relative rounded-full border flex items-center justify-center transition-all duration-300 ' + getPinBaseSize(seatId) + ' bg-amber-500 border-white shadow-[0_0_30px_rgba(245,158,11,0.6)] text-gray-900 border-2 z-20';
                newPin.innerHTML = `
                    <div class="pulse-ring"></div>
                    <span class="${getTextSize(seatId)} font-bold">${seatId}</span>
                `;

                const btn = newPin.parentElement;
                btn.classList.add('z-20');
                const tooltipHtml = `
                    <div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-black/90 backdrop-blur-md px-3 py-1 rounded-lg border border-white/20 whitespace-nowrap opacity-0 animate-[slideDown_0.3s_ease_forwards] z-30 shadow-xl" id="tooltip-${seatId}">
                        <span class="text-amber-400 font-bold text-xs">Selected</span>
                    </div>
                `;
                btn.insertAdjacentHTML('beforeend', tooltipHtml);
            }

            // 3. Kemaskini Panel Bawah
            const displaySeat = document.getElementById('display-seat');
            const displayPrice = document.getElementById('display-price');
            
            displaySeat.style.transform = 'scale(1.2)';
            displayPrice.style.transform = 'scale(1.2)';
            
            setTimeout(() => {
                displaySeat.innerText = seatId;
                document.getElementById('display-type').innerText = type;
                displayPrice.innerText = price;
                
                displaySeat.style.transform = 'scale(1)';
                displayPrice.style.transform = 'scale(1)';
            }, 150);

            currentSelected = seatId;
        }

        function getPinBaseSize(seatId) {
            if (seatId.startsWith('1')) return 'w-11 h-11';
            if (seatId.startsWith('2')) return 'w-9 h-9';
            if (seatId.startsWith('3')) return 'w-7 h-7';
            return 'w-9 h-9';
        }

        function getTextSize(seatId) {
            if (seatId.startsWith('1')) return 'text-xs';
            if (seatId.startsWith('2')) return 'text-[10px]';
            if (seatId.startsWith('3')) return 'text-[9px]';
            return 'text-xs';
        }
    </script>
</body>
</html>
