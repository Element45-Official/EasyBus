<!DOCTYPE html>
<html lang="en" class="page-edit-schedule">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBus - Edit Bus Schedule</title>
    
    <link rel="stylesheet" href="assets/css/easybus.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 md:p-10 text-white selection:bg-amber-500 selection:text-slate-900">

    <!-- Main Outer Wrapper -->
    <main class="w-full max-w-4xl my-auto">

        <!-- Glassmorphism Main Card Container -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 md:p-10 relative overflow-hidden">

            <!-- Top Subtle Light Accent Line -->
            <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-white/40 to-transparent"></div>

            <!-- HEADER SECTION -->
            <header class="flex flex-row justify-between items-center mb-8 pb-4 border-b border-white/10">
                <!-- Brand Title -->
                <a href="index.html" class="flex items-center gap-3 hover:opacity-90 transition">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950 font-bold text-xl">
                        <i class="fa-solid fa-bus"></i>
                    </div>
                    <span class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white drop-shadow-sm">Easy<span class="text-amber-400">Bus</span></span>
                </a>

                <!-- Page Header Title -->
                <div class="flex items-center gap-2 text-slate-200 font-semibold text-sm sm:text-base">
                    <i class="fa-regular fa-pen-to-square text-amber-400"></i>
                    <span>Edit Bus Schedule</span>
                </div>
            </header>

            <!-- FORM SECTION -->
            <form id="busScheduleForm" method="post" class="space-y-6">
                <input type="hidden" name="tripId" value="1">
                <p class="text-sm text-slate-300">Preview only. Saving will be available when the Java servlet is connected.</p>

                <!-- ROW 1: Bus Number & Route Assignment -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                    <!-- Bus Number -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Bus Number</label>
                        <div class="glass-input rounded-xl px-4 py-3 flex items-center gap-3">
                            <span class="text-slate-300 font-bold text-lg select-none">#</span>
                            <input type="text" id="busNumber" name="busNumber" value="ABC1234" required class="w-full bg-transparent border-none outline-none text-white font-medium placeholder-white/40 text-sm sm:text-base" placeholder="Enter Bus Number">
                        </div>
                    </div>

                    <!-- Route Assignment -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Route Assignment</label>
                        <div class="glass-input rounded-xl px-4 py-3 flex items-center gap-3">
                            <i class="fa-solid fa-route text-slate-300 text-sm"></i>
                            <input type="text" id="routeAssignment" name="routeAssignment" value="Kuala Lumpur to Johor Bahru" required class="w-full bg-transparent border-none outline-none text-white font-medium placeholder-white/40 text-sm sm:text-base" placeholder="e.g. KL to Penang">
                        </div>
                    </div>
                </div>

                <!-- ROW 2: Driver Name & Available Seats -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                    <!-- Driver Name -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Driver Name</label>
                        <div class="glass-input rounded-xl px-4 py-3 flex items-center gap-3">
                            <i class="fa-regular fa-address-card text-slate-300"></i>
                            <input type="text" id="driverName" name="driverName" value="Ahmad Albab" required class="w-full bg-transparent border-none outline-none text-white font-medium placeholder-white/40 text-sm sm:text-base" placeholder="Enter Driver Name">
                        </div>
                    </div>

                    <!-- Available Seats -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Available Seats</label>
                        <div class="glass-input rounded-xl px-4 py-3 flex items-center gap-3">
                            <i class="fa-solid fa-chair text-slate-300"></i>
                            <input type="number" id="availableSeats" name="availableSeats" value="40" min="1" max="80" required class="w-full bg-transparent border-none outline-none text-white font-medium placeholder-white/40 text-sm sm:text-base" placeholder="e.g. 40">
                        </div>
                    </div>
                </div>

                <!-- ROW 3: Departure Location & Arrival Location -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                    <!-- Departure Location -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Departure Location</label>
                        <div class="glass-input rounded-xl px-4 py-3 flex items-center gap-3">
                            <i class="fa-solid fa-location-dot text-rose-400"></i>
                            <input type="text" id="departureLocation" name="departureLocation" value="Terminal Bersepadu Selatan (TBS)" required class="w-full bg-transparent border-none outline-none text-white font-medium placeholder-white/40 text-sm sm:text-base" placeholder="Departure station">
                        </div>
                    </div>

                    <!-- Arrival Location -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Arrival Location</label>
                        <div class="glass-input rounded-xl px-4 py-3 flex items-center gap-3">
                            <i class="fa-solid fa-location-dot text-amber-400"></i>
                            <input type="text" id="arrivalLocation" name="arrivalLocation" value="Larkin Sentral, Johor Bahru" required class="w-full bg-transparent border-none outline-none text-white font-medium placeholder-white/40 text-sm sm:text-base" placeholder="Arrival station">
                        </div>
                    </div>
                </div>

                <!-- ROW 4: Departure Date, Time, Ticket Price, Status (4 cols on desktop) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 sm:gap-4">
                    <!-- Departure Date -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Departure Date</label>
                        <div class="glass-input rounded-xl px-3 py-3 flex items-center justify-between gap-2">
                            <input type="date" id="departureDate" name="departureDate" value="2026-06-01" required class="w-full bg-transparent border-none outline-none text-white font-medium text-sm sm:text-base placeholder-white/40">

                        </div>
                    </div>

                    <!-- Time -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Time</label>
                        <div class="glass-input rounded-xl px-3 py-3 flex items-center justify-between gap-2">
                            <input type="time" id="departureTime" name="departureTime" value="08:00" required class="w-full bg-transparent border-none outline-none text-white font-medium text-sm sm:text-base placeholder-white/40">

                        </div>
                    </div>

                    <!-- Ticket Price -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Ticket Price</label>
                        <div class="glass-input rounded-xl px-4 py-3 flex items-center gap-2">
                            <span class="text-amber-400 font-bold text-sm select-none">RM</span>
                            <input type="text" id="ticketPrice" name="ticketPrice" value="35.00" required class="w-full bg-transparent border-none outline-none text-white font-medium text-sm sm:text-base placeholder-white/40" placeholder="0.00">
                        </div>
                    </div>

                    <!-- Status -->
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-200 mb-2 tracking-wide">Status</label>
                        <div class="glass-input rounded-xl px-3 py-3 flex items-center justify-between relative">
                            <select id="busStatus" name="busStatus" class="w-full bg-transparent border-none outline-none text-white font-medium text-sm sm:text-base cursor-pointer appearance-none pr-6">
                                <option value="Available" selected>Available</option>
                                <option value="Full">Full</option>
                                <option value="Delayed">Delayed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                            <i class="fa-solid fa-chevron-down text-slate-300 text-xs pointer-events-none absolute right-3"></i>
                        </div>
                    </div>
                </div>

                <!-- ACTION BUTTONS SECTION -->
                <div class="pt-6 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-4">

                    <!-- Back Button (Left) -->
                    <a href="schedule-list.html" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl border border-white/20 bg-white/5 hover:bg-white/15 text-white font-semibold text-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/40">
                        <i class="fa-solid fa-arrow-left text-xs"></i>
                        <span>Back to Dashboard</span>
                    </a>

                    <!-- Reset & Update Buttons (Right) -->
                    <div class="w-full sm:w-auto flex flex-col sm:flex-row items-center gap-3">
                        <!-- Reset Schedule Button -->
                        <button type="reset" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-red-600/85 hover:bg-red-500 text-white font-bold text-sm shadow-lg shadow-red-950/40 hover:shadow-red-600/30 transition-all duration-200 active:scale-95 focus:outline-none">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>Reset Schedule</span>
                        </button>

                        <!-- Update Schedule Button -->
                        <button type="submit" disabled class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-7 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/30 hover:shadow-amber-500/50 transition-all duration-200 active:scale-95 focus:outline-none">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>Update Schedule</span>
                        </button>
                    </div>

                </div>

            </form>

        </div>

        <!-- FOOTER COPYRIGHT SECTION -->
        <footer class="text-center text-slate-400/80 text-xs sm:text-sm mt-6 font-medium tracking-wide">
            &copy; 2026 EasyBus System. All rights reserved.
        </footer>

    </main>

</body>
</html>
