<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Schedule - EasyBus Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        ebOrange: '#F59E0B', /* Brand Orange matching the logo */
                        ebBlue: '#2c4a87',   /* Matching the logo background reference roughly */
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        /* Adjust native date/time picker icons to be visible */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.2);
            transition: 0.2s;
        }
        
        /* Glass input styling focus state tweaks */
        .glass-input:focus {
            background-color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center py-10 px-4 antialiased selection:bg-ebOrange selection:text-white">

    <!-- Background Image -->
    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=2560&auto=format&fit=crop" 
             alt="Highway Background" 
             class="w-full h-full object-cover object-center" />
    </div>
    
    <!-- Dark Blue Overlay -->
    <div class="fixed inset-0 z-0 bg-blue-900/70 mix-blend-multiply pointer-events-none"></div>
    <div class="fixed inset-0 z-0 bg-gradient-to-t from-gray-900/80 to-transparent pointer-events-none"></div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-5xl">
        
        <!-- Glassmorphism Card -->
        <div class="bg-white/10 backdrop-blur-xl border border-white/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] rounded-3xl overflow-hidden">
            
            <!-- Header Section inside Card -->
            <div class="border-b border-white/20 px-8 py-6 flex flex-col md:flex-row items-center justify-between gap-4 bg-white/5">
                <!-- Recreated Logo -->
                <div class="flex items-center text-4xl font-extrabold tracking-tight drop-shadow-md">
                    <i class="fa-solid fa-bus text-ebOrange mr-2"></i>
                    <span class="text-white">Easy</span><span class="text-ebOrange">Bus</span>
                </div>
                
                <h1 class="text-white/90 text-lg md:text-xl font-medium flex items-center gap-2 drop-shadow-sm">
                    <i class="fa-solid fa-calendar-plus text-ebOrange"></i> Add New Schedule
                </h1>
            </div>

            <!-- Form Section -->
            <div class="p-8 md:p-10">
                <form action="#" method="POST">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                        
                        <!-- Bus Number -->
                        <div>
                            <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Bus Number</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500 pointer-events-none">
                                    <i class="fa-solid fa-hashtag"></i>
                                </span>
                                <input type="text" placeholder="e.g. VJE 9021" class="glass-input block w-full pl-11 pr-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                        </div>

                        <!-- Route -->
                        <div>
                            <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Route Assignment</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500 pointer-events-none">
                                    <i class="fa-solid fa-route"></i>
                                </span>
                                <input type="text" placeholder="e.g. Kuala Lumpur to Penang" class="glass-input block w-full pl-11 pr-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                        </div>

                        <!-- Driver Name -->
                        <div>
                            <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Driver Name</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500 pointer-events-none">
                                    <i class="fa-regular fa-id-card"></i>
                                </span>
                                <input type="text" placeholder="e.g. Ahmad Albab" class="glass-input block w-full pl-11 pr-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                        </div>

                        <!-- Available Seats -->
                        <div>
                            <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Available Seats</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500 pointer-events-none">
                                    <i class="fa-solid fa-chair"></i>
                                </span>
                                <input type="number" placeholder="40" class="glass-input block w-full pl-11 pr-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                        </div>

                        <!-- Departure Location -->
                        <div>
                            <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Departure Location</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500 pointer-events-none">
                                    <i class="fa-solid fa-map-pin"></i>
                                </span>
                                <input type="text" placeholder="Terminal Bersepadu Selatan (TBS)" class="glass-input block w-full pl-11 pr-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                        </div>

                        <!-- Arrival Location -->
                        <div>
                            <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Arrival Location</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-ebOrange pointer-events-none">
                                    <i class="fa-solid fa-location-dot"></i>
                                </span>
                                <input type="text" placeholder="Penang Sentral" class="glass-input block w-full pl-11 pr-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                        </div>

                        <!-- Date & Time Row -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Departure Date</label>
                                <input type="date" class="glass-input block w-full px-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                            <div>
                                <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Time</label>
                                <input type="time" class="glass-input block w-full px-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                            </div>
                        </div>

                        <!-- Price & Status Row -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Ticket Price</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-700 font-bold pointer-events-none">
                                        RM
                                    </span>
                                    <input type="number" step="0.01" placeholder="45.00" class="glass-input block w-full pl-12 pr-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner">
                                </div>
                            </div>
                            <div>
                                <label class="block text-white text-sm font-semibold mb-2 drop-shadow-sm">Status</label>
                                <select class="glass-input block w-full px-4 py-3 bg-white/60 border border-white/50 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-ebOrange transition-all shadow-inner cursor-pointer appearance-none">
                                    <option value="available" selected>Available</option>
                                    <option value="full">Full</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="mt-10 pt-6 border-t border-white/20 flex flex-col-reverse md:flex-row items-center justify-between gap-4">
                        
                        <a href="INDEX.html" class="w-full md:w-auto px-6 py-3 rounded-xl border border-white/40 text-white hover:bg-white/10 transition-all font-medium flex items-center justify-center gap-2 backdrop-blur-sm">
                            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
                        </a>

                        <div class="flex flex-col sm:flex-row w-full md:w-auto gap-4">
                            <button type="reset" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-white/20 text-white hover:bg-white/30 border border-transparent transition-all font-medium flex items-center justify-center gap-2 backdrop-blur-sm">
                                <i class="fa-solid fa-rotate-right"></i> Reset
                            </button>
                            
                            <button type="submit" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-ebOrange text-white hover:bg-orange-600 shadow-[0_4px_14px_0_rgba(245,158,11,0.39)] transition-all font-bold flex items-center justify-center gap-2 transform hover:-translate-y-1">
                                <i class="fa-solid fa-plus"></i> Add Schedule
                            </button>
                        </div>
                    </div>

                </form>
            </div>
            
        </div>
        
        <!-- Footer Info -->
        <p class="text-center text-white/50 text-sm mt-6 font-medium">
            &copy; 2026 EasyBus System. All rights reserved.
        </p>

    </main>

</body>
</html>
